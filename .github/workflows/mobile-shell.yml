name: Mobile Shell

on:
  workflow_dispatch:

jobs:
  android-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - uses: actions/upload-artifact@v4
        with:
          name: panchang-android-shell
          path: frontend/android

  ios-shell:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - uses: actions/upload-artifact@v4
        with:
          name: panchang-ios-shell
          path: frontend/ios
