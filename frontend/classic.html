<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a4a8a">
<title></title>
<link rel="stylesheet" href="/fonts.css?v=purity2">
<style>
:root{
  --glass:rgba(10,24,52,.78);
  --stroke:rgba(255,255,255,.34);
  --stroke-soft:rgba(255,255,255,.18);
  --text:#ffffff;
  --muted:rgba(255,255,255,.9);
  --muted2:rgba(255,255,255,.72);
  --good:#8dffc4;
  --bad:#ffb0bd;
  --ink:#ffffff;
  --ink-soft:rgba(255,255,255,.9);
  --fest:#ffe08a;
  --paper:rgba(255,255,255,.14);
  --shadow:0 14px 40px rgba(0,16,48,.36);
  --sky-tone:day;
  --ui-font:"Segoe UI",system-ui,-apple-system,sans-serif;
  --content-font:var(--ui-font);
  --panel-bg:rgba(8,22,48,.82);
  --state-accent:#ffc978;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--text)}
body{
  font-family:var(--ui-font);
  font-weight:400;
  background:#0b1e3d;
  overflow-x:hidden;
}
/* Regional script fonts apply only to calendar/content — never chrome/drawer */
.app,.sheet-body,.dayPanel-content{
  font-family:var(--content-font),var(--ui-font),sans-serif;
}
body.theme-light{
  --glass:rgba(255,253,248,.94);
  --stroke:rgba(26,26,26,.18);
  --stroke-soft:rgba(26,26,26,.1);
  --text:#1A1208;
  --muted:rgba(26,18,8,.78);
  --muted2:rgba(26,18,8,.62);
  --good:#0b6b3c;
  --bad:#a11d28;
  --ink:#1A1208;
  --ink-soft:rgba(26,18,8,.86);
  --fest:#7C2D12;
  --paper:rgba(255,253,245,.96);
  --shadow:0 14px 40px rgba(40,20,0,.12);
  --panel-bg:rgba(255,253,248,.96);
  --state-accent:#9c3d24;
  background:#FFFDF5;
}
body.theme-light::before{
  background:linear-gradient(180deg,#FFFDF5 0%,#F5E6C8 45%,#E8D4A8 100%) !important;
}
body.theme-light .cal-card.panji,
body.theme-light .cal-body,
body.theme-light .cal-actions button{
  color:var(--cal-ink);
}
body.theme-light .cal-head h2{color:var(--cal-ink)}
body.theme-light .cal-card .icon-btn{color:var(--cal-ink)}
body.theme-light .cal-card.panji{
  --cal-ink:#142033;
  --cal-muted:rgba(20,32,51,.62);
  --cal-line:rgba(30,58,95,.14);
  --cal-cell:#F7FAFF;
  --cal-cell-empty:rgba(30,58,95,.06);
  --cal-accent:#1B6B9A;
  --cal-glow:#C9852A;
  background:
    radial-gradient(120% 80% at 100% 0%,rgba(27,107,154,.1),transparent 55%),
    linear-gradient(180deg,#FFFFFF,#F3F7FC);
  border-color:rgba(30,58,95,.16);
  color:var(--cal-ink);
}
body.theme-light .cal-banner .shade{
  background:linear-gradient(180deg,rgba(16,36,64,.2),rgba(12,28,52,.72));
}
body.theme-light .cal-head{
  background:rgba(255,255,255,.72);
  border-color:rgba(30,58,95,.14);
  box-shadow:none;
}
body.theme-light .panji-hd,
body.theme-light .vaar-rail{
  color:rgba(20,32,51,.55);
  background:transparent;
}
body.theme-light .panji-cell .num{color:#142033}
body.theme-light .panji-cell.selected{
  background:linear-gradient(160deg,rgba(27,107,154,.14),rgba(201,133,42,.16));
  box-shadow:inset 0 0 0 1.5px rgba(27,107,154,.45),0 0 0 4px rgba(27,107,154,.1);
}
body.theme-light .panji-cell.selected .num{color:#0E3A58}
body.theme-light .legend{
  background:rgba(255,255,255,.8);
  border-color:rgba(30,58,95,.12);
}
body.theme-light .legend-title{color:#1B6B9A;background:transparent}
body.theme-light .legend-chip{
  background:rgba(27,107,154,.06);
  border-color:rgba(30,58,95,.1);
  color:#142033;
}
body.theme-light .cal-actions button{
  background:rgba(27,107,154,.06);
  border-color:rgba(30,58,95,.14);
  color:#142033;
}
body.theme-light .cal-actions .primary{
  background:linear-gradient(135deg,#1B6B9A,#0E4A6E);
  color:#fff;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:linear-gradient(180deg,#4a90d9 0%,#1f5fa8 40%,#163a72 100%);
}
#bgArt{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-size:cover;background-position:center top;
  opacity:.38;mix-blend-mode:soft-light;
  animation:bgDrift 18s ease-in-out infinite alternate;
}
@keyframes bgDrift{from{transform:scale(1.04)}to{transform:scale(1.1) translateY(-2%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes softPulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}50%{box-shadow:inset 0 0 0 1px rgba(255,200,120,.35)}}

.app{width:min(480px,100%);margin:0 auto;min-height:100vh;padding:max(10px,env(safe-area-inset-top)) 12px 28px}
@media (min-width:960px){
  .app{width:min(1180px,100%);padding:20px 16px 36px}
  .desk{display:grid;grid-template-columns:minmax(360px,1.05fr) 1fr;gap:14px;align-items:start}
  .desk > aside{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
  .desk-main{
    display:flex;flex-direction:column;gap:12px;
    max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;
    padding-right:6px;scroll-behavior:smooth;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent;
  }
  body.theme-light .desk-main{scrollbar-color:rgba(80,40,20,.35) transparent}
}
.glass{
  background:var(--glass);
  backdrop-filter:saturate(180%) blur(28px);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  border-radius:26px;
  color:var(--text);
}
#hoursWrap,#h > .glass,.list-card{
  background:var(--panel-bg);
  color:var(--text);
}
.topbar{display:flex;gap:8px;align-items:end;margin-bottom:10px;padding:12px;border-radius:22px;animation:fadeUp .45s ease both;flex-wrap:wrap}
.topbar .field{flex:1;min-width:0}
.topbar .field.btn-wrap{flex:0 1 auto;min-width:7.5rem}
.topbar label{display:block;font-size:.7rem;color:var(--muted2);margin:0 0 5px 4px;font-weight:600}
.topbar select,.topbar button,.topbar input[type="date"]{
  width:100%;height:42px;border-radius:14px;border:1px solid var(--stroke);
  background:var(--panel-bg);color:var(--text);font:inherit;padding:0 10px;outline:none;
}
.topbar button#btn{
  width:auto;min-width:100%;padding:0 14px;white-space:nowrap;
  font-size:clamp(.72rem,2.4vw,.88rem);font-weight:800;overflow:hidden;text-overflow:ellipsis;
}
/* Multi-script stack so each state option renders in its own regional glyphs */
#state{
  font-family:
    NotoSansDevanagari, NotoSansKannada, NotoSansTamil, NotoSansTelugu,
    NotoSansMalayalam, NotoSansOriya, NotoSansBengali, NotoSansGujarati,
    NotoSansGurmukhi, var(--ui-font), sans-serif !important;
}
.topbar select option{color:#111;background:#fff}
.topbar button{background:rgba(255,255,255,.32);font-weight:700;cursor:pointer}
.date-field{
  position:relative;min-width:0;width:100%;height:42px;
  border-radius:14px;border:1px solid var(--stroke);
  background:var(--panel-bg);
}
.date-field input[type="date"]{
  position:absolute;inset:0;width:100%;height:100%;
  border:0;border-radius:14px;background:transparent !important;
  color:transparent !important;caret-color:transparent;
  font:inherit;padding:0 32px 0 10px;outline:none;z-index:2;
  color-scheme:dark;min-width:0;-webkit-text-fill-color:transparent;
}
.date-field input[type="date"]::-webkit-calendar-picker-indicator{
  cursor:pointer;opacity:.9;filter:invert(1) brightness(1.2);
}
.date-field .date-display{
  position:absolute;inset:0 32px 0 0;display:flex;align-items:center;padding:0 10px;
  pointer-events:none;z-index:1;font-family:var(--content-font),var(--ui-font),sans-serif;
  font-size:clamp(.68rem,.9vw,.8rem);font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.35);
}
body.theme-light .date-field{
  background:rgba(255,255,255,.96);
  border-color:rgba(26,18,8,.2);
}
body.theme-light .date-field input[type="date"]{
  color-scheme:light;
}
body.theme-light .date-field input[type="date"]::-webkit-calendar-picker-indicator{
  filter:none;opacity:.72;
}
body.theme-light .date-field .date-display{
  color:#1A1208 !important;
  -webkit-text-fill-color:#1A1208;
  text-shadow:none;
}
.topbar .field.date-wrap{flex:1 1 150px;min-width:128px;max-width:220px}

.hero{text-align:center;padding:20px 14px 14px;margin-bottom:12px;overflow:hidden;animation:fadeUp .55s ease both;background:var(--panel-bg)}
.hero-orb{
  width:76px;height:76px;margin:0 auto 6px;border-radius:50%;background-size:cover;background-position:center;
  box-shadow:0 10px 36px rgba(0,0,0,.28);animation:floatY 7s ease-in-out infinite;
}
.place{font-size:1.12rem;font-weight:600;margin:0;color:var(--text)}
.hero-date{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.hero-main{margin:8px 0 0;font-size:clamp(2rem,8vw,2.9rem);font-weight:300;letter-spacing:-.02em;line-height:1.08;color:var(--text)}
.hero-sub{margin:8px 0 0;font-size:1rem;font-weight:600;color:var(--text)}
.hero-meta{margin:6px 0 0;color:var(--muted);font-size:.88rem}
.status-pill{
  display:inline-flex;margin-top:10px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid var(--stroke-soft);font-size:.74rem;color:var(--muted);
}
body.theme-light .status-pill{background:rgba(0,0,0,.05)}
.section-title{margin:0 0 8px;font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:0 2px}
.h-scroll,.rashi-scroll{
  display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 10px;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;touch-action:pan-x;cursor:grab;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.45) rgba(255,255,255,.08);
}
.h-scroll:active,.rashi-scroll:active{cursor:grabbing}
.h-scroll::-webkit-scrollbar,.rashi-scroll::-webkit-scrollbar{height:7px;display:block}
.h-scroll::-webkit-scrollbar-thumb,.rashi-scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.42);border-radius:999px;
}
body.theme-light .h-scroll,body.theme-light .rashi-scroll{scrollbar-color:rgba(80,40,20,.4) rgba(0,0,0,.06)}
body.theme-light .h-scroll::-webkit-scrollbar-thumb,body.theme-light .rashi-scroll::-webkit-scrollbar-thumb{background:rgba(80,40,20,.35)}
.hour-card{
  flex:0 0 84px;text-align:center;padding:10px 6px;border-radius:18px;cursor:pointer;
  background:rgba(255,255,255,.12);border:1px solid var(--stroke-soft);color:var(--text);
  scroll-snap-align:start;animation:riseIn .42s cubic-bezier(.22,.8,.24,1) both;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.hour-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.18)}
.hour-card:nth-child(1){animation-delay:.02s}.hour-card:nth-child(2){animation-delay:.05s}
.hour-card:nth-child(3){animation-delay:.08s}.hour-card:nth-child(4){animation-delay:.11s}
.hour-card:nth-child(5){animation-delay:.14s}.hour-card:nth-child(6){animation-delay:.17s}
.hour-card:nth-child(7){animation-delay:.2s}.hour-card:nth-child(8){animation-delay:.23s}
.hour-card:nth-child(n+9){animation-delay:.26s}
.hour-card .t{font-size:.68rem;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hour-card img{width:32px;height:32px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block}
.hour-card .v{font-size:.74rem;font-weight:700;line-height:1.15;color:var(--text)}
.hour-card.good{box-shadow:inset 0 0 0 1px rgba(141,255,196,.45);animation:riseIn .42s cubic-bezier(.22,.8,.24,1) both,softPulse 3.6s ease-in-out infinite}
.hour-card.bad .v{color:var(--bad)}
.hour-card.good .v{color:var(--good)}
body.theme-light .hour-card{background:rgba(255,255,255,.88);border-color:rgba(26,18,8,.12)}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.widget{
  padding:14px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
  background:var(--panel-bg);color:var(--text);animation:riseIn .5s ease both;
  transition:transform .18s ease;
}
.widget:hover{transform:translateY(-2px)}
.widget .lbl{display:flex;align-items:center;gap:7px;font-size:.7rem;color:var(--muted);font-weight:700}
.widget .lbl img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.widget .val{font-size:1.02rem;font-weight:700;line-height:1.25;margin-top:8px;color:var(--text)}
.widget .hint{margin-top:5px;font-size:.74rem;color:var(--muted2)}
.list-card{padding:6px 12px 8px;margin-bottom:12px}
.list-row{display:grid;grid-template-columns:1.2fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--stroke-soft);font-size:.9rem;cursor:pointer;color:var(--text)}
.list-row:last-child{border-bottom:0}
.list-row .time{color:var(--muted);font-size:.8rem;text-align:right}
.good{color:var(--good)}.bad{color:var(--bad)}
.rashi-panel{padding:12px;margin-bottom:12px;animation:fadeUp .5s ease both}
.rashi-focus{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;padding:10px 12px;border-radius:16px;
  background:rgba(255,255,255,.1);border:1px solid var(--stroke-soft);font-size:.78rem;color:var(--text);
}
.rashi-focus b{color:var(--state-accent,#ffc978);font-weight:800}
.rashi-list{display:flex;flex-direction:column;gap:8px;max-height:none;overflow:visible;padding-right:2px}
.rashi-item.open .rashi-body{display:block;padding-bottom:16px}
.rashi-body .block h4{
  margin:0 0 4px;font-size:.72rem;font-weight:800;letter-spacing:.03em;
  color:#ffc978;
}
.rashi-body .block p{margin:0;font-size:.88rem;line-height:1.5;color:#fff}
.rashi-item{
  border-radius:18px;border:1px solid var(--stroke-soft);background:rgba(8,22,48,.9);
  overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease;min-height:52px;
}
.rashi-item.open{border-color:rgba(255,200,120,.45);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.rashi-item.moon-today{box-shadow:inset 0 0 0 1px rgba(255,200,120,.55)}
.rashi-item.sun-today{outline:1px dashed rgba(255,180,80,.55);outline-offset:-1px}
.rashi-head{
  width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:12px 14px;border:0;background:transparent;color:#fff;font:inherit;text-align:left;cursor:pointer;
  min-height:52px;
}
.rashi-head .name{font-weight:800;font-size:1rem;color:#fff;line-height:1.25}
.rashi-head .meta{font-size:.72rem;color:rgba(255,255,255,.82);margin-top:3px}
.rashi-item:not(.open) .rashi-head .meta{display:none}
.rashi-head .chev{font-size:1.1rem;opacity:.85;color:#fff;transition:transform .2s ease}
.rashi-item.open .chev{transform:rotate(180deg)}
.rashi-body{
  display:none;padding:0 14px 14px;border-top:1px solid var(--stroke-soft);
  animation:riseIn .35s ease both;color:#fff;
}
.rashi-item.open .rashi-body{display:block}
.rashi-body .pred{margin:10px 0 8px;font-size:.88rem;line-height:1.5;color:#fff}
.rashi-body .block{margin:10px 0 0}
.rashi-body .block h4{
  margin:0 0 4px;font-size:.7rem;font-weight:800;letter-spacing:.04em;
  color:rgba(255,200,120,.95);text-transform:uppercase;
}
.rashi-body .block p{margin:0;font-size:.84rem;line-height:1.45;color:rgba(255,255,255,.92)}
.rashi-body .state-box{
  margin-top:12px;padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke-soft);
  color:#fff;
}
.rashi-body .state-box h4{margin:0 0 6px;color:var(--state-accent,#ffc978)}
.rashi-body .state-box p{margin:0;font-size:.84rem;line-height:1.45;color:rgba(255,255,255,.92)}
body.theme-light .rashi-body .block h4{color:#9c3d24}
body.theme-light .rashi-body .block p{color:rgba(26,18,8,.88)}
body.theme-light .rashi-body{
  color:#1A1208;
  border-top-color:rgba(26,18,8,.1);
}
body.theme-light .rashi-body .state-box{
  background:rgba(26,18,8,.04);
  border-color:rgba(26,18,8,.1);
  color:#1A1208;
}
body.theme-light .rashi-body .state-box h4{color:#9c3d24}
body.theme-light .rashi-body .state-box p{color:rgba(26,18,8,.88)}
body.theme-light .rashi-body .pred{color:#1A1208}
.rashi-body .facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.rashi-body .fact{
  font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:999px;
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.9);border:1px solid var(--stroke-soft);
}
.rashi-body .daily-title{font-size:.72rem;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.78);margin:0 0 6px}
.rashi-body .daily{font-size:.84rem;line-height:1.45;color:rgba(255,255,255,.9);margin:0}
.rashi-body .daily.loading{opacity:.7}
body.theme-light .rashi-focus,body.theme-light .rashi-item{background:rgba(255,255,255,.94)}
body.theme-light .rashi-head,body.theme-light .rashi-head .name,body.theme-light .rashi-head .chev{color:#1A1208}
body.theme-light .rashi-head .meta,body.theme-light .rashi-body .pred,body.theme-light .rashi-body .daily{color:rgba(26,18,8,.86)}
body.theme-light .rashi-body .fact{background:rgba(0,0,0,.05);color:rgba(26,18,8,.75)}
body.theme-light .rashi-body .daily-title{color:rgba(26,18,8,.62)}
.rashi-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.rashi-card{
  flex:0 0 min(78%,250px);padding:12px;border-radius:20px;background:rgba(255,255,255,.12);
  border:1px solid var(--stroke-soft);min-height:140px;cursor:pointer;position:relative;overflow:hidden;
  scroll-snap-align:start;color:var(--text);
}
.rashi-card .name{font-weight:700;position:relative;color:var(--text)}
.rashi-card p{margin:7px 0;font-size:.84rem;color:var(--muted);line-height:1.4;position:relative}
.rashi-card .lucky{font-size:.72rem;color:var(--muted2);position:relative}
.brand-foot{text-align:center;margin:6px 0 0;color:var(--muted2);font-size:.72rem}
.hidden{display:none !important}

.cal-card{
  --cal-ink:#EAF2FF;
  --cal-muted:rgba(234,242,255,.68);
  --cal-line:rgba(140,190,255,.18);
  --cal-cell:rgba(255,255,255,.07);
  --cal-cell-empty:rgba(255,255,255,.03);
  --cal-accent:#6EC8FF;
  --cal-glow:#F0C14A;
  padding:0;margin-bottom:12px;animation:fadeUp .5s ease both;overflow:hidden;
  background:
    radial-gradient(120% 90% at 0% 0%,rgba(80,150,255,.22),transparent 55%),
    radial-gradient(90% 70% at 100% 10%,rgba(240,193,74,.12),transparent 50%),
    linear-gradient(165deg,rgba(12,28,58,.92),rgba(8,18,40,.96));
  border:1px solid rgba(140,190,255,.28);
  color:var(--cal-ink);
  box-shadow:0 18px 40px rgba(4,12,28,.35);
}
.cal-card .section-title{
  color:var(--cal-accent);padding:12px 14px 0;letter-spacing:.14em;
  text-transform:uppercase;font-size:.68rem;font-weight:800;opacity:.92;
}
.cal-banner{
  position:relative;height:118px;overflow:hidden;
  border-bottom:1px solid rgba(140,190,255,.2);
  mask-image:linear-gradient(180deg,#000 55%,transparent);
}
.cal-banner img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.04);animation:bannerDrift 14s ease-in-out infinite alternate;
  filter:saturate(1.05) contrast(1.05);
}

<script>
const $ = (id) => document.getElementById(id);
const I = window.I18N;
const STATE_CODES = Object.keys(I.stateLang || {}).sort();
let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1;
let monthDays = [];
let calLayout = "col_weekday";
let calStyle = "hindu";
let lastPayload = null;
let skyTone = "day";

function lang() {
  return I.stateLang[$("state").value] || "kn";
}
function ui() { return I.ui[lang()] || I.ui.hi; }
function N(value) {
  // Convert Western digits → regional script digits (never leave English 0-9 in UI copy).
  if (value == null) return "—";
  const L = lang();
  const digits = I.digits[L];
  if (!digits) return String(value);
  return String(value).replace(/[0-9]/g, (d) => digits[Number(d)]);
}
function localizeTime(value) {
  if (value == null || value === "") return "—";
  const map = I.ampm[lang()] || I.ampm.hi;
  return N(String(value).replace(/\bAM\b/gi, map.AM).replace(/\bPM\b/gi, map.PM));
}
function localizeDate(iso) {
  if (!iso) return "—";
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return N(iso);
  const months = I.months[lang()] || I.months.hi;
  return N(`${Number(m[3])} ${months[Number(m[2]) - 1]} ${m[1]}`);
}
function pad2(n) { return String(n).padStart(2, "0"); }
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function shortTerm(s) {
  if (!s) return "";
  const parts = String(s).trim().split(/\s+/);
  const last = parts[parts.length - 1];
  return Array.from(last).slice(0, 8).join("");
}
function term(arrOrMap, key, fallback) {
  if (!arrOrMap) return fallback || "—";
  const v = arrOrMap[key];
  return v != null && v !== "" ? v : (fallback || "—");
}
function isMobile() { return window.matchMedia("(max-width: 959px)").matches; }

function stateArtUrl(code) {
  // Map territories / missing art packs to the closest available state artwork.
  const fallback = {
    LD: "KL",
    PY: "TN",
    AN: "GA",
    CH: "DL",
    LA: "JK",
    DN: "GJ",
    SK: "UK",
    TR: "AS",
    MN: "AS",
    ML: "AS",
    MZ: "AS",
    NL: "AS",
    AR: "AS",
  };
  const key = fallback[code] || code;
  const known = new Set([
    "AP","AS","BR","CG","DL","GA","GJ","HP","HR","JH","JK","KA","KL","MH",
    "MP","OD","PB","RJ","TN","TS","UK","UP","WB",
  ]);
  const use = known.has(key) ? key : "MH";
  return `/assets/states/state-${use}.png`;
}

function applyStateArt() {
  const code = $("state").value;
  const url = stateArtUrl(code);
  const img = $("stateArt");
  const fallbackArt = "/assets/hero-sky.png";
  img.onerror = () => { img.onerror = null; img.src = fallbackArt; };
  img.src = `${url}?v=1`;
  const name = nativeStateName(code);
  $("bannerState").textContent = name;
  $("bannerStyle").textContent = styleLabel();
  $("bgArt").style.backgroundImage = `url("${url}?v=1")`;
  const orb = $("heroOrb");
  if (orb) {
    orb.style.backgroundImage = `url("${url}?v=1")`;
    // If image fails, soft-fallback via probe
    const probe = new Image();
    probe.onerror = () => { orb.style.backgroundImage = `url("${fallbackArt}")`; };
    probe.src = `${url}?v=1`;
  }
}

function styleLabel() {
  const style = I.stateStyle[$("state").value] || calStyle || "";
  const map = {
    odia: "ଓଡ଼ିଆ ପଞ୍ଜି",
    bengali: "বাংলা পঞ্জিকা",
    assamese: "অসমীয়া পঞ্জিকা",
    marathi: "मराठी पंचांग",
    gujarati: "ગુજરાતી પંચાંગ",
    rajasthani: "राजस्थानी पंचांग",
    punjabi: "ਪੰਜਾਬੀ ਕੈਲੰਡਰ",
    tamil: "தமிழ் பஞ்சாங்கம்",
    malayalam: "മലയാളം പഞ്ചാംഗം",
    kannada: "ಕನ್ನಡ ಪಂಚಾಂಗ",
    telugu: "తెలుగు పంచాంగం",
    hindu: "हिन्दू पंचांग",
    hindi: "हिन्दी पंचांग",
    maithili: "मैथिली पंचांग",
    tribal: "क्षेत्रीय पंचांग",
    himalayan: "हिमालयी पंचांग",
    himachali: "हिमाचली पंचांग",
    kashmiri: "कश्मीरी पंचांग",
    konkani: "कोंकणी पंचांग",
  };
  return map[style] || (ui().calendar || ui().title);
}

function applyFont() {
  // Regional script fonts apply ONLY to calendar/content via --content-font.
  // Body + drawer stay on Latin UI font forever (fixes Hindi glyph bleed in menu).
  const L = lang();
  const fam = I.fonts[L] || null;
  document.documentElement.style.setProperty(
    "--content-font",
    fam ? `"${fam}", var(--ui-font)` : "var(--ui-font)"
  );
  document.body.style.fontFamily = "var(--ui-font)";
  document.documentElement.lang = "en";
  document.body.dataset.scriptLang = L || "";
}
function applyInk(tone) {
  skyTone = tone;
  window.skyTone = tone;
  if (document.body.classList.contains("theme-light")) {
    // Keep high-contrast dark ink on parchment; do not wash with sky whites.
    const root = document.documentElement.style;
    root.setProperty("--text", "#1A1208");
    root.setProperty("--muted", "rgba(26,18,8,.78)");
    root.setProperty("--muted2", "rgba(26,18,8,.62)");
    root.setProperty("--ink", "#1A1208");
    root.setProperty("--ink-soft", "rgba(26,18,8,.86)");
    root.setProperty("--fest", "#7C2D12");
    root.setProperty("--good", "#0b6b3c");
    root.setProperty("--bad", "#a11d28");
    root.setProperty("--panel-bg", "rgba(255,253,248,.96)");
    root.setProperty("--glass", "rgba(255,253,248,.94)");
    root.setProperty("--state-accent", "#9c3d24");
    return;
  }
  // Adaptive ink on dark glass: always bright text so glyphs stay readable
  const ink = {
    day: { text: "#ffffff", muted: "rgba(255,255,255,.9)", fest: "#fff3b0", ink: "#ffffff", soft: "rgba(255,255,255,.9)" },
    evening: { text: "#fff8f2", muted: "rgba(255,245,235,.9)", fest: "#ffd28a", ink: "#fff8f2", soft: "rgba(255,245,235,.9)" },
    dusk: { text: "#fff6ff", muted: "rgba(255,245,255,.9)", fest: "#ffd6ff", ink: "#fff8ff", soft: "rgba(255,245,255,.9)" },
    night: { text: "#f2f7ff", muted: "rgba(230,240,255,.9)", fest: "#c9e4ff", ink: "#f5f9ff", soft: "rgba(230,240,255,.9)" },
  }[tone] || {
    text: "#ffffff", muted: "rgba(255,255,255,.9)", fest: "#ffe08a", ink: "#ffffff", soft: "rgba(255,255,255,.9)",
  };
  const root = document.documentElement.style;
  root.setProperty("--text", ink.text);
  root.setProperty("--muted", ink.muted);
  root.setProperty("--muted2", "rgba(255,255,255,.72)");
  root.setProperty("--ink", ink.ink);
  root.setProperty("--ink-soft", ink.soft);
  root.setProperty("--fest", ink.fest);
  root.setProperty("--good", "#8dffc4");
  root.setProperty("--bad", "#ffb0bd");
  root.setProperty("--panel-bg", "rgba(8,22,48,.82)");
  root.setProperty("--glass", "rgba(10,24,52,.78)");
  root.setProperty("--state-accent", "#ffc978");

window.applyInk = applyInk;

function nativeStateLang(code) {
  return I.stateLang[code] || null;
}

/** Each state label in its own regional script (MH→Marathi, TN→Tamil, …). */
function nativeStateName(code) {
  // Prefer authoritative native map first (never translate into current UI language).
  if (window.NATIVE_STATE_NAMES && window.NATIVE_STATE_NAMES[code]) {
    return window.NATIVE_STATE_NAMES[code];
  }
  const L = nativeStateLang(code);
  if (L && I.states[L] && I.states[L][code]) return I.states[L][code];
  for (const lang of Object.keys(I.states || {})) {
    if (I.states[lang][code]) return I.states[lang][code];
  }
  return code;
}

function fillStateOptions() {
  const sel = $("state");
  const cur = sel.value || "MH";
  const codes = [
    ...new Set([
      ...Object.keys(window.NATIVE_STATE_NAMES || {}),
      ...STATE_CODES,
      ...Object.keys(I.stateLang || {}),
    ]),
  ].sort();
  sel.innerHTML = codes
    .map((code) => {

function moonPhaseSrc(tithiIndex) {
  const t = Math.max(1, Math.min(30, Number(tithiIndex) || 1));
  // Map 1..30 across 8 phase images (Amavasya≈30/1, Purnima≈15)
  if (t === 30 || t === 1) return MOON_PHASE_ICON[0];
  if (t === 15) return MOON_PHASE_ICON[4];
  const idx = Math.min(7, Math.floor(((t - 1) / 30) * 8));
  return MOON_PHASE_ICON[idx];
}
function nakshatraSrc(nakIndex) {
  const n = Math.max(1, Math.min(27, Number(nakIndex) || 1));
  return `/assets/panji/nakshatra/${String(n).padStart(2, "0")}.svg`;
}
function festivalIconSrc(events) {
  if (!events?.length) return null;
  const blob = events
    .map((e) => `${e.id || ""} ${e.names?.en || ""} ${e.names?.hi || ""}`.toLowerCase())
    .join(" ");
  const rules = [
    [/diwali|deepavali|kali\s*puja|naraka/, "diwali"],
    [/sankranti|pongal|makar|bih|lohri|vishu/, "sankranti"],
    [/holi|dol\s*purnima|dhuliyandan|rang/, "holi"],
    [/ganesh|vinayak|ganapati/, "ganesh"],
    [/navratri|durga|dashami|vijaya/, "navratri"],
    [/durga|kali(?!\s*puja)/, "durga"],
    [/shiv|mahasiv|shivaratri|pradosh/, "shiv"],
    [/krishna|janmashtami|jayanti.*krish/, "krishna"],
    [/ram|ramanavami|sita/, "rama"],
    [/ekadashi/, "default"],
  ];
  for (const [re, key] of rules) {
    if (re.test(blob)) return `/assets/panji/festival/${key}.svg`;
  }
  return "/assets/panji/festival/default.svg";
}

/** Every day: moon phase + nakshatra picture; festivals add a festival picture. */
function panjiIconList(day) {
  if (!day) return [];
  const icons = [];
  const push = (src, alt) => {
    if (!src) return;
    if (icons.some((x) => x.src === src)) return;
    icons.push({ src, alt });
  };
  const marks = day.marks || [];
  // Moon sign / phase picture for every day
  if (marks.includes("amavasya")) push(PANJI_ICON.amavasya, "amavasya");
  else if (marks.includes("purnima")) push(PANJI_ICON.purnima, "purnima");
  else push(moonPhaseSrc(day.tithi_index), "moon");

  // Nakshatra (moon mansion) picture for every day
  push(nakshatraSrc(day.nakshatra_index), "nakshatra");

  // Festival picture when present
  const fest = monthFestivalsByDate[day.date];
  const festSrc = festivalIconSrc(fest);
  if (festSrc) push(festSrc, "festival");
  else if (marks.includes("ekadashi")) push(PANJI_ICON.ekadashi, "ekadashi");

  return icons.slice(0, 3);
}

function marksHtml(day) {
  return panjiIconList(day)
    .map((x) => panjiIconImg(x.src, x.alt))
    .join("");
}

function cellHtml(day) {
  if (!day) return `<button type="button" class="panji-cell empty" disabled></button>`;
  const icons = panjiIconList(day);
  const festTitle = (monthFestivalsByDate[day.date] || [])
    .map((e) => e.names?.en || e.id)
    .filter(Boolean)
    .join(", ");
  const cls = ["panji-cell"];
  if (day.date === $("date").value) cls.push("selected");
  if (day.date === todayIso()) cls.push("today");
  if (day.vaar_index === 0 || day.vaar_index === 6) cls.push("weekend");
  if (icons.length || (day.marks || []).length || festTitle) cls.push("fest");
  return `<button type="button" class="${cls.join(" ")}" data-iso="${day.date}" title="${festTitle || ""}">
    <span class="num">${N(day.day)}</span>
    <span class="marks">${marksHtml(day)}</span>
  </button>`;
}

function renderPanjiGrid() {
  const L = lang();

  const byDay = Object.fromEntries(monthDays.map((d) => [d.day, d]));
  const firstDow = new Date(viewYear, viewMonth - 1, 1).getDay();

  const panel = $("calendarPanel");
  panel.className = `glass cal-card panji ${calStyle}`;

  if (calLayout === "row_weekday") {
    const weeks = Math.ceil((firstDow + total) / 7);
    let html = `<div class="panji-grid rows"><div class="panji-hd"></div>`;
    for (let w = 1; w <= weeks; w++) html += `<div class="panji-hd">${N(w)}</div>`;
    for (let v = 0; v < 7; v++) {
      html += `<div class="vaar-rail">${Array.from(vaar[v] || "").slice(0, 3).join("")}</div>`;
      for (let w = 0; w < weeks; w++) {
        const idx = w * 7 + v - firstDow + 1;

/** Horizontal strips: wheel → scroll-x, drag to pan */
function bindStripScroll(el) {
  if (!el || el.dataset.scrollBound === "1") return;
  el.dataset.scrollBound = "1";
  el.addEventListener(
    "wheel",
    (e) => {
      if (el.scrollWidth <= el.clientWidth + 2) return;
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    },
    { passive: false }
  );
  let dragging = false;
  let startX = 0;
  let startLeft = 0;
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    dragging = true;
    startX = e.clientX;
    startLeft = el.scrollLeft;
    el.setPointerCapture?.(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    el.scrollLeft = startLeft - (e.clientX - startX);
  });
  const endDrag = () => { dragging = false; };
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
}

function refreshStripScroll() {
  document.querySelectorAll(".h-scroll, .rashi-scroll").forEach(bindStripScroll);

function localizePlanet(term, L) {
  return (PLANET_LOCAL[L] || PLANET_LOCAL.hi || {})[term] || term;
}

function rashiLabel(i, L) {
  return (I.rashi[L] || I.rashi.hi)[i] || RASHI_SIGNS[i];
}

function escAttr(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderRashiPanel(h, p, u, L) {
  const moonIdx = (() => {
    if (p.astronomy?.moon_rashi_index) return Math.max(0, Math.min(11, p.astronomy.moon_rashi_index - 1));
    return Math.max(0, Math.min(11, Math.floor((p.astronomy?.moon_sidereal_longitude || 0) / 30)));
  })();
  const sunIdx = (() => {
    if (p.astronomy?.sun_rashi_index) return Math.max(0, Math.min(11, p.astronomy.sun_rashi_index - 1));
    return Math.max(0, Math.min(11, Math.floor((p.astronomy?.sun_sidereal_longitude || 0) / 30)));
  })();
  const moonName = rashiLabel(moonIdx, L);
  const sunName = rashiLabel(sunIdx, L);
  const moonLbl = u.moon_sign || "Moon sign";
  const sunLbl = u.sun_sign || "Sun sign";
  const planetLbl = u.ruling_planet || "Ruling planet";
  const stateName = nativeStateName($("state").value) || $("state").value;
  const rows = (h.rashifal || []).map((x, i) => {
    const display = x.rashi || rashiLabel(i, L);
    const sign = x.sign || RASHI_SIGNS[i];
    const planet = localizePlanet(x.planet || RASHI_PLANETS[i], L);
    const element = localizePlanet(x.element || "", L);
    const flags = [
      i === moonIdx ? "moon-today" : "",
      i === sunIdx ? "sun-today" : "",
    ].filter(Boolean).join(" ");
    const badge = i === moonIdx ? ` · ${moonLbl}` : (i === sunIdx ? ` · ${sunLbl}` : "");
    const overview = x.overview || x.prediction_long || x.prediction || "";
    const section = (title, body) =>
      body ? `<div class="block"><h4>${title}</h4><p>${escAttr(body)}</p></div>` : "";
    return `<article class="rashi-item ${flags}" data-sign="${sign}" data-index="${i}">
      <button type="button" class="rashi-head" aria-expanded="false">
        <span>
          <div class="name">${display}${badge}</div>
          <div class="meta">${planetLbl}: ${planet}${element ? ` · ${element}` : ""} · ${u.lucky}: ${x.lucky_color || "—"} · ${N(x.lucky_number || "")}</div>
        </span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="rashi-body">
        <div class="facts">
          <span class="fact">${planetLbl}: ${planet}</span>
          ${element ? `<span class="fact">${element}</span>` : ""}
          <span class="fact">${u.lucky}: ${x.lucky_color || "—"} · ${N(x.lucky_number || "")}</span>
          ${i === moonIdx ? `<span class="fact">${moonLbl}</span>` : ""}
          ${i === sunIdx ? `<span class="fact">${sunLbl}</span>` : ""}
        </div>
        ${section(u.overview || "Overview", overview)}
        ${section(u.work || "Work", x.work)}
        ${section(u.family || "Family", x.family)}
        ${section(u.health || "Health", x.health)}
        ${section(u.remedy || "Remedy", x.remedy)}
        <div class="detail-mount" data-detail-mount></div>
      </div>
    </article>`;
  }).join("");
  return `<div class="glass rashi-panel">
    <div class="section-title">${u.rashifal}</div>
    <div class="rashi-focus">
      <span>${moonLbl}: <b>${moonName}</b></span>
      <span>${sunLbl}: <b>${sunName}</b></span>
      <span>${u.state || "State"}: <b>${stateName}</b></span>
    </div>
    <div class="rashi-list">${rows}</div>
  </div>`;
}

function renderRashiDetailHtml(d, u, L) {
  const st = d.state || {};
  const systems = (I.systems && (I.systems[L] || I.systems.hi)) || {};
  // Prefer API-localized labels; only re-map from English keys when needed.
  const systemOut = (!/[A-Za-z]{3,}/.test(st.system || "") && st.system)
    || systems[st.system_en] || systems[st.system] || st.system || "—";
  const muhuratOut = (!/[A-Za-z]{3,}/.test(st.muhurat || "") && st.muhurat)
    || systems[st.muhurat_en] || systems[st.muhurat] || st.muhurat || "—";
  const section = (title, body) => {
    const s = String(body || "").trim();
    if (!s) return "";
    return `<div class="block"><h4>${title}</h4><p>${escAttr(s)}</p></div>`;
  };
  return `
    <div class="state-box">
      <h4>${u.state_context || "Regional panchang"}</h4>
      <p>${escAttr(st.note || "")}</p>
      <div class="facts" style="margin-top:8px">
        <span class="fact">${escAttr(systemOut)}</span>
        <span class="fact">${escAttr(muhuratOut)}</span>
        ${st.vaar ? `<span class="fact">${escAttr(st.vaar)}</span>` : ""}
        ${st.nakshatra ? `<span class="fact">${escAttr(st.nakshatra)}</span>` : ""}
        ${st.tithi ? `<span class="fact">${escAttr(st.tithi)}</span>` : ""}
        ${d.is_moon_sign ? `<span class="fact">${u.moon_sign || "Moon"}</span>` : ""}
        ${d.is_sun_sign ? `<span class="fact">${u.sun_sign || "Sun"}</span>` : ""}
      </div>
    </div>
    ${section(u.daily_horoscope || "Daily", d.daily?.horoscope)}
    ${section(u.weekly_horoscope || "Weekly", d.weekly?.horoscope)}
    ${section(u.monthly_horoscope || "Monthly", d.monthly?.horoscope)}`;
}

function bindRashiExpand(root) {
  if (!root) return;
  root.querySelectorAll(".rashi-item").forEach((item) => {
    const head = item.querySelector(".rashi-head");
    const mount = item.querySelector("[data-detail-mount]");
    if (!head || head.dataset.bound === "1") return;
    head.dataset.bound = "1";
    head.addEventListener("click", async () => {
      const opening = !item.classList.contains("open");
      root.querySelectorAll(".rashi-item.open").forEach((el) => {
        if (el !== item) {
          el.classList.remove("open");
          el.querySelector(".rashi-head")?.setAttribute("aria-expanded", "false");
        }
      });
      item.classList.toggle("open", opening);
      head.setAttribute("aria-expanded", opening ? "true" : "false");
      if (opening) {
        item.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
      if (!opening || !mount) return;
      // Always refresh detail so language/state changes never leave a stale Hindi/English mix.
      mount.dataset.loaded = "0";
      mount.innerHTML = `<p class="daily loading">${ui().calculating || "…"}</p>`;
      try {
        const sign = item.dataset.sign || "aries";
        const L = lang();
        const qs = new URLSearchParams({
          sign,
          lang: L,
          state_code: $("state").value,
          date_str: $("date").value,
          lat: $("lat").value,
          lon: $("lon").value,
          timezone: "Asia/Kolkata",
        });
        const d = await fetch(`/api/v1/rashifal/detail?${qs}`).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        });
        mount.innerHTML = renderRashiDetailHtml(d, ui(), L);
        mount.dataset.loaded = "1";
        item.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (err) {
        mount.innerHTML = `<p class="daily">${escAttr(String(err.message || err))}</p>`;
      }
    });
  });
}

function openSheet() {
  if (!isMobile() || !lastPayload) return;
  const { html, hero } = lastPayload;
  $("sheetTitle").textContent = hero.stateName;
  $("sheetBody").innerHTML = `
    <section class="glass hero">
      <div class="hero-orb" style="background-image:url('${stateArtUrl($("state").value)}?v=1')"></div>
      <h1 class="place">${hero.stateName}</h1>
      <p class="hero-date">${hero.date}</p>
      <div class="hero-main">${hero.tithi}</div>
      <div class="hero-sub">${hero.sub}</div>
      <div class="hero-meta">${hero.meta}</div>
    </section>
    <section class="glass" style="padding:12px;margin-bottom:12px">
      <div class="section-title">${html.hoursTitle}</div>
      <div class="h-scroll">${html.hours}</div>
    </section>
    <section class="widgets">${html.widgets}</section>
    ${html.list}
    <div id="sheetRashi"></div>`;
  if (lastPayload.rashiHtml) $("sheetRashi").innerHTML = lastPayload.rashiHtml;
  bindDetails($("sheetBody"));
  bindRashiExpand($("sheetRashi") || $("sheetBody"));
  refreshStripScroll();
  $("daySheet").classList.add("open");
  $("daySheet").setAttribute("aria-hidden", "false");
}
function closeSheet() {
  $("daySheet").classList.remove("open");
  $("daySheet").setAttribute("aria-hidden", "true");
}

async function loadAll() {
  const u = ui();
  $("status").textContent = u.calculating;
  try {
    const qs = new URLSearchParams({
      state_code: $("state").value,
      lat: $("lat").value,
      lon: $("lon").value,
      timezone: "Asia/Kolkata",
      date_str: $("date").value,
      lang: lang(),
    });
    const p = await fetch(`/api/v1/panchang?${qs}`).then((x) => x.json());
    const loc = localizePanchang(p);
    const scene = sceneAssets(p);
    applySky(scene.sky, scene.main);
    const html = renderDayHtml(p, loc, scene);

    $("title").textContent = html.hero.stateName;
    $("heroDate").textContent = html.hero.date;
    $("heroMain").textContent = html.hero.tithi;
    $("heroSub").textContent = html.hero.sub;
    $("heroMeta").textContent = html.hero.meta;
    $("heroOrb").style.backgroundImage = `url("${stateArtUrl($("state").value)}?v=1")`;
    $("hoursTitle").textContent = html.hoursTitle;
    $("hours").innerHTML = html.hours || `<div class="hour-card"><div class="v">—</div></div>`;
    $("widgets").innerHTML = html.widgets;
    $("r").innerHTML = html.list;
    bindDetails($("dayPanel"));

    const L = lang();
    const h = await fetch(`/api/v1/rashifal?lang=${L}&date_str=${$("date").value}`).then((x) => x.json());
    const rashiHtml = renderRashiPanel(h, p, u, L);
    $("h").innerHTML = rashiHtml;
    bindRashiExpand($("h"));
    refreshStripScroll();

    lastPayload = { html, hero: html.hero, rashiHtml, p };
    $("status").textContent = u.complete;
    renderPanjiGrid();
    window.dispatchEvent(new CustomEvent("panchang:loaded", { detail: { p, loc, html } }));
  } catch (e) {
    $("status").textContent = `${u.error}: ${e.message}`;
  }
}

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
  if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
  loadMonthGrid();
}

$("date").value = todayIso();
viewYear = Number($("date").value.slice(0, 4));
viewMonth = Number($("date").value.slice(5, 7));
$("state").value = "MH";
$("lang").value = "mr";
applyChrome();

$("prevMonth").addEventListener("click", () => shiftMonth(-1));
$("nextMonth").addEventListener("click", () => shiftMonth(1));
$("btnToday").addEventListener("click", async () => {
  $("date").value = todayIso();
  viewYear = Number($("date").value.slice(0, 4));
  viewMonth = Number($("date").value.slice(5, 7));
  await loadMonthGrid();
  await loadAll();
});
$("btnCalLoad").addEventListener("click", loadAll);
$("btn").addEventListener("click", loadAll);
$("sheetClose").addEventListener("click", closeSheet);
$("daySheet").addEventListener("click", (e) => { if (e.target.id === "daySheet") closeSheet(); });
$("state").addEventListener("change", async () => {
  $("lang").value = lang();
  applyChrome();
  await loadAll();
});
$("date").addEventListener("change", async () => {
  const v = $("date").value;
  if (!v) return;
  syncDateDisplay();
  viewYear = Number(v.slice(0, 4));
  viewMonth = Number(v.slice(5, 7));
  await loadMonthGrid();
  await loadAll();
});
loadAll();
syncDateDisplay();
</script>
