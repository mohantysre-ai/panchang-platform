services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: panchang-api:latest
    container_name: panchang-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8088"
      FRONTEND_DIR: /frontend
      REDIS_ENABLED: "false"
      POSTGRES_ENABLED: "false"
      JSON_STORAGE_ENABLED: "true"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/v1/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - default
      - trade_api_default

  # Optional extras — enable with: docker compose --profile full up -d
  redis:
    profiles: ["full"]
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panchang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  trade_api_default:
    external: true
